services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # Explicit root-only Local Docker development target. Production must use
      # the default non-root server target and must never mount docker.sock.
      target: server-dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./problems:/problems
      - problem_artifacts:/var/lib/k8s-quiz/problem-artifacts
    environment:
      # In-compose network address of the db service. Not interpolated from
      # .env on purpose: the .env DATABASE_URL targets localhost for running
      # the backend outside compose, which would be wrong inside the network.
      - DATABASE_URL=postgres://k8squiz:k8squiz@db:5432/k8squiz?sslmode=disable
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PROBLEMS_REPO_PATH=/problems
      - PROBLEM_ARTIFACT_STORE_PATH=/var/lib/k8s-quiz/problem-artifacts
      # Interpolated so non-local deployments activate the weak-secret boot
      # guard in config.Validate(); local .env keeps http://localhost:5173.
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - DEPLOYMENT_MODE=development
      # Explicit private Compose bind: the backend is reachable only on the
      # Compose network because this service publishes no host port.
      - SERVER_BIND_MODE=compose-private
      - SERVER_HOST=backend
      - RUNNER_PROVIDER=${RUNNER_PROVIDER:-local-docker}
      - RUNNER_SCOPE=${RUNNER_SCOPE:?set a unique RUNNER_SCOPE for this Compose project}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - SERVER_PORT=${SERVER_PORT:-8080}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      # Legacy pre-warm pool; the generation-bound Runner rejects non-zero.
      - POOL_SIZE=${POOL_SIZE:-0}
      - POOL_IMAGE=${POOL_IMAGE:-k3s-base:latest}
      # Development-only default; public mode requires an explicit positive cap.
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Local Docker is development-only; prevent accidental LAN/public access.
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      - POSTGRES_USER=k8squiz
      - POSTGRES_PASSWORD=k8squiz
      - POSTGRES_DB=k8squiz
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-boot schema load: 00-load-migrations.sh applies *.up.sql from
      # /migrations in order (initdb phase only, i.e. empty volume). Runtime
      # upgrades are applied by the backend's embedded migration runner.
      - ./backend/migrations:/migrations:ro
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k8squiz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Build-only profile for the k3s-base problem image:
  #   docker compose --profile image build k3s-base   (or: make image)
  k3s-base:
    image: k3s-base:latest
    build: ./docker/k3s-base
    profiles: ["image"]
    entrypoint: ["true"]
    restart: "no"

volumes:
  pgdata:
  problem_artifacts:
