id: pv-pending
title: "PVC Pending 해결"
description: |
  PersistentVolumeClaim이 Pending 상태로 계속 대기 중입니다.
  PVC가 Bound 상태가 되고, 이를 사용하는 Pod이 정상적으로 Running 되도록 수정하세요.

  힌트: kubectl describe pvc 명령어로 이벤트를 확인해보세요.
category: storage
difficulty: easy
type: fix
timeout_minutes: 15
verify_type: script
base_image: k3s-base:latest
