id: pod-crashloop
title: "Pod 생성 실패 (ConfigMap 키 오류)"
description: |
  web-app Pod이 정상적으로 생성되지 못하고 CreateContainerConfigError 상태에 빠져 있습니다.
  원인을 파악하고 Pod이 정상적으로 Running 상태가 되도록 수정하세요.
  
  힌트: kubectl describe pod 명령어로 이벤트를 확인해보세요.
category: pod
difficulty: easy
type: fix
timeout_minutes: 15
verify_type: script
base_image: k3s-base:latest
