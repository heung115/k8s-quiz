id: deploy-nginx
title: "웹 서버 배포"
description: |
  nginx 웹 서버를 `web-server`라는 이름의 Deployment로 배포하세요.

  조건:
  - 이미지: nginx:alpine
  - replica: 3개
  - 모든 Pod가 Running(Ready) 상태여야 합니다.

  kubectl을 사용해 매니페스트를 작성하고 배포하세요.
category: scheduling
difficulty: easy
type: deploy
timeout_minutes: 15
verify_type: script
base_image: k3s-base:latest
