id: configmap-typo
title: "ConfigMap 키 오타 원인 찾기"
description: |
  web-app Pod이 CrashLoopBackOff 상태입니다.
  애플리케이션은 DATABASE_HOST 환경 변수가 필요하지만, ConfigMap 참조에 문제가 있습니다.
  원인을 파악하고 아래 선택지 중 올바른 것을 고르세요.
category: config
difficulty: easy
type: find
timeout_minutes: 10
verify_type: choice
base_image: k3s-base:latest
choices:
  - id: a
    text: "ConfigMap 자체가 존재하지 않는다"
  - id: b
    text: "ConfigMap의 키 이름이 Deployment에서 참조하는 키와 다르다"
  - id: c
    text: "Pod의 image가 잘못되었다"
  - id: d
    text: "Node의 리소스가 부족하다"
correct_choice: b
